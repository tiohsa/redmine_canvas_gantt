name: Git Workflow Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Docker Compose configuration
        working-directory: .
        run: docker compose config

  build:
    name: build
    needs: init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        run: npm run build

      - name: Verify tracked SPA build artifacts
        run: npm run check:build-artifacts

  lint:
    name: lint
    needs: init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check async state contract boundaries
        run: npm run check:async-contract

  test:
    name: test
    needs: init
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test -- --run

  timezone-test:
    name: Unit tests (${{ matrix.timezone }})
    needs: init
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone:
          - UTC
          - Asia/Tokyo
          - America/Los_Angeles
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test -- --run

  spa-benchmark:
    name: SPA Benchmark
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run benchmark regression gate
        run: npm run benchmark:ci

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: spa/bench/results/benchmark-results.json
          if-no-files-found: ignore

  project-move-mock-e2e:
    name: Project move mock E2E
    needs:
      - build
      - lint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Project move mock suite
        run: npx playwright test tests/e2e/gantt-project-move.pw.ts

      - name: Run Work Timer multi-tab mock suite
        run: npx playwright test tests/e2e/gantt-work-timer-multitab.pw.ts

  e2e-redmine-compat:
    name: Redmine ${{ matrix.label }} compatibility
    needs:
      - build
      - lint
      - test
      - timezone-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 6.0
            image: redmine:6.0.6
            version: 6.0.6
            rspec: '~> 7.1'
            full_e2e: false
          - label: 6.1
            image: redmine:6.1.2
            version: 6.1.2
            rspec: '~> 7.1'
            full_e2e: true
          - label: 7.0
            image: redmine:7.0.0
            version: 7.0.0
            rspec: '~> 8.0'
            full_e2e: true
    env:
      REDMINE_IMAGE: ${{ matrix.image }}
    defaults:
      run:
        working-directory: spa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SPA assets for Redmine
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Redmine stack and wait for health
        working-directory: .
        run: |
          docker compose up -d --wait --wait-timeout 600
          docker compose ps

      - name: Verify Redmine version
        working-directory: .
        run: |
          docker compose exec -T redmine bundle exec rails runner \
            "expected = '${{ matrix.version }}'.split('.').map(&:to_i); actual = [Redmine::VERSION::MAJOR, Redmine::VERSION::MINOR, Redmine::VERSION::TINY]; abort \"Expected Redmine ${{ matrix.version }}, got #{Redmine::VERSION}\" unless actual == expected"

      - name: Install backend test dependencies
        working-directory: .
        run: |
          docker compose exec -T -u root redmine apt-get update
          docker compose exec -T -u root redmine apt-get install -y --no-install-recommends build-essential
          docker compose exec -T redmine env -u BUNDLE_WITHOUT bundle config unset without
          docker compose exec -T redmine env -u BUNDLE_WITHOUT bundle add rspec-rails --version '${{ matrix.rspec }}' --group test --skip-install
          docker compose exec -T redmine env -u BUNDLE_WITHOUT bundle install --jobs 4 --retry 3

      - name: Load Redmine default data
        working-directory: .
        run: docker compose exec -T -e REDMINE_LANG=en redmine bundle exec rake redmine:load_default_data

      - name: Load Redmine fixtures
        working-directory: .
        run: docker compose exec -T redmine bundle exec rake db:fixtures:load

      - name: Install business calendar fixture
        working-directory: .
        run: |
          docker compose exec -T redmine mkdir -p /usr/src/redmine/config/redmine_canvas_gantt/business_calendars
          docker compose cp examples/business_calendars/. redmine:/usr/src/redmine/config/redmine_canvas_gantt/business_calendars/

      - name: Run backend specs
        working-directory: .
        run: docker compose exec -T redmine env -u BUNDLE_WITHOUT bundle exec rspec plugins/redmine_canvas_gantt/spec

      - name: Enable Canvas Gantt in test project
        working-directory: .
        run: |
          docker compose exec -T redmine bundle exec rails runner "
            project = Project.find_by!(identifier: 'ecookbook')
            project.enabled_module_names = (project.enabled_module_names + ['canvas_gantt']).uniq
            project.save!

            role = Role.find_by(name: 'Manager') || Role.first
            role.permissions = (role.permissions + [:view_canvas_gantt, :manage_canvas_gantt_baseline]).uniq
            role.save!

            member = Member.find_or_initialize_by(project: project, user_id: 1)
            member.role_ids = [role.id]
            member.save!

            viewer_role = Role.find_or_create_by!(name: 'Canvas Gantt Viewer')
            viewer_role.permissions = [:view_issues, :view_canvas_gantt]
            viewer_role.save!
            viewer = User.find_or_initialize_by(login: 'canvas_gantt_viewer')
            viewer.update!(firstname: 'Canvas', lastname: 'Viewer', mail: 'canvas-gantt-viewer@example.test', password: 'canvas-gantt-viewer', password_confirmation: 'canvas-gantt-viewer', status: User::STATUS_ACTIVE)
            viewer_membership = Member.find_or_initialize_by(project: project, user: viewer)
            viewer_membership.role_ids = [viewer_role.id]
            viewer_membership.save!

            baseline_role = Role.find_or_create_by!(name: 'Canvas Gantt Baseline Manager')
            baseline_role.permissions = [:view_issues, :view_canvas_gantt, :manage_canvas_gantt_baseline]
            baseline_role.save!
            baseline_manager = User.find_or_initialize_by(login: 'canvas_gantt_baseline_manager')
            baseline_manager.update!(firstname: 'Canvas', lastname: 'Baseline Manager', mail: 'canvas-gantt-baseline-manager@example.test', password: 'canvas-gantt-baseline-manager', password_confirmation: 'canvas-gantt-baseline-manager', status: User::STATUS_ACTIVE)
            baseline_membership = Member.find_or_initialize_by(project: project, user: baseline_manager)
            baseline_membership.role_ids = [baseline_role.id]
            baseline_membership.save!

            Setting.rest_api_enabled = '1'
          "

      - name: Run Redmine compatibility smoke test
        if: ${{ !matrix.full_e2e }}
        run: npx playwright test -c playwright.redmine.config.ts tests/e2e-redmine/redmine-smoke.pw.ts tests/e2e-redmine/work-timer.pw.ts

      - name: Run business calendar E2E
        if: ${{ !matrix.full_e2e }}
        run: npx playwright test -c playwright.redmine.config.ts tests/e2e-redmine/business-calendar.pw.ts

      - name: Run mutation contract E2E
        if: ${{ !matrix.full_e2e }}
        run: npx playwright test -c playwright.redmine.config.ts tests/e2e-redmine/mutation-contract.pw.ts

      - name: Run baseline permission E2E
        if: ${{ !matrix.full_e2e }}
        run: npx playwright test -c playwright.redmine.config.ts tests/e2e-redmine/baseline-permissions.pw.ts

      - name: Run full Redmine E2E suite
        if: ${{ matrix.full_e2e }}
        run: npx playwright test -c playwright.redmine.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-redmine-${{ matrix.label }}-compat
          path: spa/playwright-report
          if-no-files-found: ignore

      - name: Print container logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs --no-color

      - name: Stop Redmine stack
        if: always()
        working-directory: .
        run: docker compose down -v
